name: Release

# Only on a release tag. Nothing here runs for ordinary pushes or PRs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # The artifacts are named from `appVersion` in the build file, not from
      # the tag. If the two disagree, a v0.2.0 release would carry files called
      # Shotgun-0.1.0.apk - and a published release cannot be corrected.
      - name: Check the tag matches the app version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::Could not read appVersion from app/build.gradle.kts."
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match appVersion $version." \
                 "Update app/build.gradle.kts, or tag v$version."
            exit 1
          fi
          echo "Tag and app version agree: $version"

      # A published release is immutable: its assets can never be replaced. An
      # unsigned APK would therefore burn the version number for good, so a
      # missing key stops the run here rather than at the point of no return.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Refusing to cut" \
                 "an immutable release of unsigned artifacts."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore

      - name: Build release
        env:
          RELEASE_KEYSTORE_FILE: keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      # The build falls back to an unsigned APK if the keystore did not load,
      # which is exactly the outcome the step above exists to prevent - so the
      # signature is confirmed on the artifact itself, not inferred.
      - name: Verify the artifacts are signed
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 || true)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools."
            exit 1
          fi
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying $apk"
          "$apksigner" verify --print-certs "$apk"

      - name: Remove the keystore
        if: ${{ always() }}
        run: rm -f keystore/release.keystore

      # The APK is named by the build; the bundle is not, so it is renamed to
      # match here rather than shipping Shotgun-0.1.0.apk beside app-release.aab.
      - name: Collect the artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/Shotgun-*.apk artifacts/
          cp app/build/outputs/bundle/release/*.aab "artifacts/Shotgun-$version.aab"
          ls -l artifacts

      # Assets are attached to a *draft*. A release becomes immutable when it
      # is published, and assets cannot be added afterwards, so the upload has
      # to finish first.
      - name: Draft the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true

      # Publishing seals it, and is what triggers the documentation workflow.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
