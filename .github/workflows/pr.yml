name: PR

# Builds the app, then runs the static checks and unit tests against it.
on:
  # Every pull request, whatever its base. Stacked PRs are based on the branch
  # below them rather than on main, and a base filter would leave each one in
  # the stack unverified.
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Optional: the dev signing key, held as a repository secret. Absent it,
      # the build falls back to the SDK's own debug key and still succeeds.
      - name: Restore dev keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No dev key configured - using the default debug key."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore

      - name: Assemble debug
        env:
          DEBUG_KEYSTORE_FILE: keystore/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f keystore/debug.keystore

      # The unit test and lint jobs need the same compiled output, so it is
      # carried across rather than built three times.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Full history, not the default single commit: SonarQube reads git blame
      # to date each line, and a shallow clone leaves every line looking new -
      # which is also what decides what counts as "new code" on a PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Runs the tests and the JaCoCo report in one go: the coverage task
      # depends on the test task, so asking for both does not run them twice.
      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --stacktrace

      # Uploaded on failure too - the HTML report is how you find out which
      # assertion went red without re-running locally.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: ignore

      # SonarQube Cloud hosts the coverage badges in the README and decorates
      # the PR. Whether the token exists is decided in a run step rather than in
      # the analysis step's own `if`: a step's own `env:` is not in scope for
      # its own condition, so the check has to happen before it - the same shape
      # as the optional keystore above.
      - name: Is SonarQube configured?
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SONAR_TOKEN - skipping the analysis."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # A fork's pull request cannot read secrets, so this is skipped there
      # rather than failing a run the contributor cannot fix.
      #
      # The classes and the JaCoCo report the scanner reads were produced by the
      # step above, in this same workspace, so this only runs the analysis.
      - name: Analyse with SonarQube
        if: ${{ !cancelled() && steps.sonar.outputs.configured == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --stacktrace

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
