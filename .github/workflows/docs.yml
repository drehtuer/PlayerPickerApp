name: Documentation

# Publishes the GitHub Pages site. Releases only - the site should describe a
# released version, not whatever is currently on main.
on:
  # The release tag, *not* `release: published`. A release published by a
  # workflow using the default GITHUB_TOKEN does not trigger further workflow
  # runs, so a `release` trigger here would simply never fire - the site would
  # silently never publish. The tag is pushed by a person, so it does.
  push:
    tags: ['v*']
  # Kept so the site can be republished without cutting a release.
  workflow_dispatch:

# Read-only by default. The two write scopes Pages needs are granted on the
# `deploy` job alone, below: the job that builds the site runs Gradle, Jekyll
# and a third-party action, and none of that should be able to publish.
permissions:
  contents: read

# One deployment at a time; do not cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Dokka resolves the compile classpath, so it needs the Android SDK. The
      # runner image ships one, but declaring it keeps the job from depending
      # on what happens to be baked into the image.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Generate API documentation
        run: ./gradlew :app:dokkaGenerate --stacktrace

      # GitHub's own Pages toolchain, using _config.yml at the repository root.
      # The documentation is rendered from the Markdown in place - README.md and
      # docs/ - so the site cannot drift from what the repository shows.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Dokka's output goes in after Jekyll, not before: it contains
      # underscore-prefixed files, which Jekyll would drop, and it is already
      # HTML that needs no rendering.
      #
      # Assembled in a fresh directory rather than written into `_site`.
      # jekyll-build-pages is a container action running as root, so `_site`
      # belongs to root while this job does not - writing into it fails with a
      # bare "Permission denied". Copying *out* of it needs only read.
      - name: Assemble the published site
        run: |
          set -euo pipefail
          test -d app/build/dokka/html
          mkdir -p site/api
          cp -r _site/. site/
          cp -r app/build/dokka/html/. site/api/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    # Only this job publishes, so only this job can. `id-token` is what
    # deploy-pages exchanges for its deployment credential.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
